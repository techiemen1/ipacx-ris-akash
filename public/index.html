<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iPACX Viewer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>iPacx RIS/PACS</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      (function() {
        let lastActiveViewportId = null;

        function trackActiveViewport(e) {
          try {
            const target = e.target;
            if (!target) return;
            if (target.closest && target.closest('.study-browser, .thumbnail-list, .sidebar, .study-list, .series-quick-switch, [class*="thumbnail"], [class*="Thumbnail"], [class*="SeriesItem"]')) {
              return;
            }
            const vpElement = target.closest ? target.closest('[data-viewport-uid], [data-cy="viewport-container"], .viewport-element, .viewport-wrapper, .cornerstone-viewport-element, .viewport-grid-item, div[class*="viewport"], div[class*="Viewport"]') : null;
            if (vpElement) {
              const uid = vpElement.getAttribute('data-viewport-uid') || vpElement.id || vpElement.getAttribute('data-cy');
              if (uid) {
                lastActiveViewportId = uid;
              }
            }
          } catch (err) {}
        }

        document.addEventListener('mousedown', trackActiveViewport, true);
        document.addEventListener('pointerdown', trackActiveViewport, true);
        document.addEventListener('click', trackActiveViewport, true);
        document.addEventListener('wheel', trackActiveViewport, true);

        window.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'OHIF_GET_ACTIVE_VIEWPORT') {
            try {
              const servicesManager = window.servicesManager || (window.ohif && window.ohif.servicesManager) || (window.ohifApp && window.ohifApp.servicesManager);
              const vgs = servicesManager ? servicesManager.services.viewportGridService : null;
              const dss = servicesManager ? servicesManager.services.displaySetService : null;
              const cvs = servicesManager ? servicesManager.services.cornerstoneViewportService : null;

              let activeViewportId = lastActiveViewportId;

              if (!activeViewportId && vgs) {
                try {
                  const gridState = typeof vgs.getState === 'function' ? vgs.getState() : null;
                  activeViewportId = (gridState && gridState.activeViewportId) || (typeof vgs.getActiveViewportId === 'function' ? vgs.getActiveViewportId() : null);
                } catch(e) {}
              }

              if (!activeViewportId) {
                try {
                  const candidates = Array.from(document.querySelectorAll('[data-viewport-uid], [data-cy="viewport-container"], .viewport-element, .viewport-wrapper, .viewport-grid-item'));
                  for (let i = 0; i < candidates.length; i++) {
                    const el = candidates[i];
                    const uid = el.getAttribute('data-viewport-uid') || el.id;
                    if (!uid) continue;
                    if (el.classList.contains('active') || el.classList.contains('border-primary') || el.getAttribute('data-active') === 'true') {
                      activeViewportId = uid;
                      break;
                    }
                    const style = window.getComputedStyle ? window.getComputedStyle(el) : null;
                    if (style && style.borderColor) {
                      const bc = style.borderColor.toLowerCase();
                      if (bc.includes('0, 132, 199') || bc.includes('2, 132, 199') || bc.includes('56, 189, 248') || bc.includes('#0284c7') || bc.includes('#0084c7')) {
                        activeViewportId = uid;
                        break;
                      }
                    }
                  }
                } catch(e) {}
              }

              if (!activeViewportId && vgs && typeof vgs.getActiveViewportId === 'function') {
                activeViewportId = vgs.getActiveViewportId();
              }

              console.log('[OHIF Bridge] Active Viewport ID:', activeViewportId);

              let viewport = null;
              if (vgs && activeViewportId) {
                if (typeof vgs.getViewport === 'function') {
                  try { viewport = vgs.getViewport(activeViewportId); } catch(e) {}
                }
                if (!viewport && typeof vgs.getState === 'function') {
                  try {
                    const st = vgs.getState();
                    if (st && st.viewports) {
                      if (typeof st.viewports.get === 'function') viewport = st.viewports.get(activeViewportId);
                      else if (typeof st.viewports === 'object') viewport = st.viewports[activeViewportId];
                    }
                  } catch(e) {}
                }
              }

              console.log('[OHIF Bridge] Viewport Object:', viewport);

              const displaySetInstanceUID = viewport ? (viewport.displaySetInstanceUID || (Array.isArray(viewport.displaySetInstanceUIDs) ? viewport.displaySetInstanceUIDs[0] : null)) : null;
              const displaySet = (dss && displaySetInstanceUID && typeof dss.getDisplaySetByUID === 'function') ? dss.getDisplaySetByUID(displaySetInstanceUID) : null;
              const cornerstoneViewport = (cvs && activeViewportId && typeof cvs.getCornerstoneViewport === 'function') ? cvs.getCornerstoneViewport(activeViewportId) : null;

              let sliceNumber = 1;
              let totalSlices = 1;
              let sopInstanceUid = null;
              let seriesInstanceUID = displaySet ? (displaySet.SeriesInstanceUID || displaySet.seriesInstanceUid) : null;
              let seriesDescription = displaySet ? (displaySet.SeriesDescription || displaySet.seriesDescription) : null;
              let modality = displaySet ? (displaySet.Modality || displaySet.modality) : 'CT';

              if (cornerstoneViewport) {
                try {
                  if (typeof cornerstoneViewport.getCurrentImageIdIndex === 'function') {
                    sliceNumber = cornerstoneViewport.getCurrentImageIdIndex() + 1;
                  } else if (typeof cornerstoneViewport.getSliceIndex === 'function') {
                    sliceNumber = cornerstoneViewport.getSliceIndex() + 1;
                  }
                } catch(e) {}

                try {
                  const imageIds = cornerstoneViewport.getImageIds ? cornerstoneViewport.getImageIds() : [];
                  totalSlices = imageIds.length || 1;
                  if (imageIds.length > 0 && sliceNumber > 0) {
                    const currentImageId = imageIds[sliceNumber - 1] || imageIds[0];
                    if (!seriesInstanceUID && currentImageId) {
                      const sMatch = currentImageId.match(/series\/([a-zA-Z0-9._-]+)/i) || currentImageId.match(/seriesInstanceUID=([a-zA-Z0-9._-]+)/i);
                      if (sMatch) seriesInstanceUID = sMatch[1];
                    }
                  }
                } catch(e) {}
              }

              if (displaySet && displaySet.images && displaySet.images[sliceNumber - 1]) {
                sopInstanceUid = displaySet.images[sliceNumber - 1].SOPInstanceUID || displaySet.images[sliceNumber - 1].sopInstanceUid;
              } else if (displaySet && displaySet.images && displaySet.images[0]) {
                sopInstanceUid = displaySet.images[0].SOPInstanceUID || displaySet.images[0].sopInstanceUid;
              }

              console.log('[OHIF Bridge] DisplaySet:', displaySet);
              console.log('[OHIF Bridge] SeriesDescription:', seriesDescription);

              window.parent.postMessage({
                type: 'OHIF_VIEWPORT_STATE',
                success: true,
                viewportId: activeViewportId,
                seriesInstanceUID: seriesInstanceUID,
                seriesDescription: seriesDescription,
                modality: modality,
                sopInstanceUid: sopInstanceUid,
                sliceNumber: sliceNumber,
                totalSlices: totalSlices
              }, '*');
            } catch (err) {
              console.error('[OHIF Bridge] Error:', err);
              window.parent.postMessage({ type: 'OHIF_VIEWPORT_STATE', error: err.message }, '*');
            }
          }
        });
      })();
    </script>
  </body>
</html>
