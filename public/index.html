<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iPACX Viewer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>iPacx RIS/PACS</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'OHIF_GET_ACTIVE_VIEWPORT') {
          try {
            const servicesManager = window.servicesManager || (window.ohif && window.ohif.servicesManager) || (window.ohifApp && window.ohifApp.servicesManager);
            if (!servicesManager) {
              window.parent.postMessage({ type: 'OHIF_VIEWPORT_STATE', error: 'Services not ready' }, '*');
              return;
            }

            const vgs = servicesManager.services.viewportGridService;
            const dss = servicesManager.services.displaySetService;
            const cvs = servicesManager.services.cornerstoneViewportService;

            const activeViewportId = vgs ? vgs.getActiveViewportId() : null;
            const viewport = (vgs && activeViewportId) ? vgs.getViewport(activeViewportId) : null;
            const displaySetInstanceUID = viewport ? (viewport.displaySetInstanceUID || (Array.isArray(viewport.displaySetInstanceUIDs) ? viewport.displaySetInstanceUIDs[0] : null)) : null;
            const displaySet = (dss && displaySetInstanceUID) ? dss.getDisplaySetByUID(displaySetInstanceUID) : null;
            const cornerstoneViewport = (cvs && activeViewportId) ? cvs.getCornerstoneViewport(activeViewportId) : null;

            let sliceNumber = 1;
            let totalSlices = 1;
            let sopInstanceUid = null;

            if (cornerstoneViewport) {
              sliceNumber = (cornerstoneViewport.getCurrentImageIdIndex ? cornerstoneViewport.getCurrentImageIdIndex() : 0) + 1;
              const imageIds = cornerstoneViewport.getImageIds ? cornerstoneViewport.getImageIds() : [];
              totalSlices = imageIds.length || 1;
            }

            if (displaySet && displaySet.images && displaySet.images[sliceNumber - 1]) {
              sopInstanceUid = displaySet.images[sliceNumber - 1].SOPInstanceUID || displaySet.images[sliceNumber - 1].sopInstanceUid;
            } else if (displaySet && displaySet.images && displaySet.images[0]) {
              sopInstanceUid = displaySet.images[0].SOPInstanceUID || displaySet.images[0].sopInstanceUid;
            }

            window.parent.postMessage({
              type: 'OHIF_VIEWPORT_STATE',
              success: true,
              seriesInstanceUID: displaySet ? (displaySet.SeriesInstanceUID || displaySet.seriesInstanceUid) : null,
              seriesDescription: displaySet ? (displaySet.SeriesDescription || displaySet.seriesDescription) : null,
              modality: displaySet ? (displaySet.Modality || displaySet.modality) : 'CT',
              sopInstanceUid: sopInstanceUid,
              sliceNumber: sliceNumber,
              totalSlices: totalSlices
            }, '*');
          } catch (err) {
            window.parent.postMessage({ type: 'OHIF_VIEWPORT_STATE', error: err.message }, '*');
          }
        }
      });
    </script>
  </body>
</html>
