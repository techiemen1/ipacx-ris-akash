name: Project CI Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: npm run check --if-present

      - name: Backend test
        working-directory: backend
        run: npx jest --passWithNoTests --forceExit

      - name: Backend build (if exists)
        working-directory: backend
        run: npm run build --if-present

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    needs: backend   # <-- ensures frontend runs only if backend succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend build
        run: CI=false npm run build

