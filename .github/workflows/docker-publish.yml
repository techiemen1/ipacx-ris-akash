name: Build and Push Docker Hub Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-backend:${{ github.sha }}

      # 2. Build and Push Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-frontend:${{ github.sha }}

      # 3. Build and Push MWL Service Image
      - name: Build & Push MWL Service
        uses: docker/build-push-action@v5
        with:
          context: ./mwl-service
          file: ./mwl-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-mwl-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-mwl-service:${{ github.sha }}

      # 4. Build and Push OHIF Viewer Image
      - name: Build & Push OHIF Viewer
        uses: docker/build-push-action@v5
        with:
          context: ./ohif-viewer
          file: ./ohif-viewer/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-ohif:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ipacx-ohif:${{ github.sha }}
