name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ipacx-backend:latest
            ghcr.io/${{ github.repository }}/ipacx-backend:${{ github.sha }}

      # 2. Build and Push Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ipacx-frontend:latest
            ghcr.io/${{ github.repository }}/ipacx-frontend:${{ github.sha }}

      # 3. Build and Push MWL Service Image
      - name: Build & Push MWL Service
        uses: docker/build-push-action@v5
        with:
          context: ./mwl-service
          file: ./mwl-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ipacx-mwl-service:latest
            ghcr.io/${{ github.repository }}/ipacx-mwl-service:${{ github.sha }}

