apiVersion: v1
kind: Namespace
metadata:
  name: ipacx-ris
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipacx-ris-config
  namespace: ipacx-ris
data:
  POSTGRES_HOST: ipacx-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ris
  POSTGRES_USER: postgres
  ORTHANC_URL: http://ipacx-orthanc:8042/
  REDIS_URL: redis://ipacx-redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipacx-backend
  namespace: ipacx-ris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipacx-backend
  template:
    metadata:
      labels:
        app: ipacx-backend
    spec:
      containers:
        - name: backend
          image: ipacx/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ipacx-ris-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ipacx-backend
  namespace: ipacx-ris
spec:
  selector:
    app: ipacx-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipacx-frontend
  namespace: ipacx-ris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipacx-frontend
  template:
    metadata:
      labels:
        app: ipacx-frontend
    spec:
      containers:
        - name: frontend
          image: ipacx/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ipacx-frontend
  namespace: ipacx-ris
spec:
  selector:
    app: ipacx-frontend
  ports:
    - port: 80
      targetPort: 80
