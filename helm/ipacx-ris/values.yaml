backend:
  image: ipacx/backend:latest
  replicas: 2
  port: 5000

frontend:
  image: ipacx/frontend:latest
  replicas: 2
  port: 80

postgres:
  host: ipacx-postgres
  port: 5432
  database: ris
  user: postgres

redis:
  url: redis://ipacx-redis:6379

orthanc:
  url: http://ipacx-orthanc:8042/

ingress:
  enabled: false
  host: ris.example.local
